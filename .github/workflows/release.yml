# On every push to main, release-please opens or updates a release PR that
# bumps the version and changelog from Conventional Commit messages
# (fix: patch, feat: minor, feat!/BREAKING CHANGE: major). Merging that PR
# tags the release, and the build jobs attach the installers to it.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in this workflow because tags created with GITHUB_TOKEN don't
  # trigger other workflows.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: "darwin:arm64 darwin:x64"
          - os: windows-latest
            targets: "win32:x64"
          - os: ubuntu-latest
            targets: "linux:x64"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      # Pinned: the bundled Invariant UI must not change between rebuilds of the same tag.
      - name: Build Invariant UI
        env:
          INVARIANT_REF: cf600c936883adf0038ee8499f2a868d0d7534d8
        run: |
          git clone https://github.com/mcarlucci/invariant.git "$RUNNER_TEMP/invariant"
          git -C "$RUNNER_TEMP/invariant" checkout "$INVARIANT_REF"
          cd "$RUNNER_TEMP/invariant"
          npx -y pnpm@12.16.1 install --frozen-lockfile
          npx -y pnpm@12.16.1 run build:npm
      - name: Bundle Invariant UI
        run: npm run fetch-invariant -- --from "$RUNNER_TEMP/invariant/dist-npm"
      # Stops a release whose bundled Invariant can't compile a design system (Compliance -> Contract).
      - name: Check bundled Invariant UI
        run: npx vitest run tests/invariant.e2e.test.ts
      - name: Bundle Node.js and git
        run: |
          for t in ${{ matrix.targets }}; do
            npm run fetch-node -- --platform "${t%%:*}" --arch "${t##*:}"
            npm run fetch-git -- --platform "${t%%:*}" --arch "${t##*:}"
          done
      # Mac secrets are empty on other runners; electron-builder ignores them there.
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.blockmap dist/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "No installers in dist/"; exit 1; }
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${files[@]}" --clobber
