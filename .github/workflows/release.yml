# On every push to main, release-please opens or updates a release PR that
# bumps the version and changelog from Conventional Commit messages
# (fix: patch, feat: minor, feat!/BREAKING CHANGE: major). Merging that PR
# tags the release, and the build jobs attach the installers to it.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in this workflow because tags created with GITHUB_TOKEN don't
  # trigger other workflows.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: "darwin:arm64 darwin:x64"
          - os: windows-latest
            targets: "win32:x64"
          - os: ubuntu-latest
            targets: "linux:x64"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundle Node.js and git
        run: |
          for t in ${{ matrix.targets }}; do
            npm run fetch-node -- --platform "${t%%:*}" --arch "${t##*:}"
            npm run fetch-git -- --platform "${t%%:*}" --arch "${t##*:}"
          done
      - run: npm run dist
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "No installers in dist/"; exit 1; }
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${files[@]}" --clobber
