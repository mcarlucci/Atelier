# Publishes site/ to GitHub Pages. Brand and demo assets are copied in at build
# time from assets/ and docs/images/ so they live in one place only.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/atelier/svg/**
      - docs/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect assets
        run: |
          mkdir -p site/assets
          cp assets/atelier/svg/*.svg site/assets/
          cp docs/images/build.gif docs/images/build-dark.gif docs/images/select-and-edit.gif docs/images/ask-ai.gif docs/images/compliance.gif docs/images/setup.gif site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
